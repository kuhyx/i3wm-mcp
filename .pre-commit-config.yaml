# Pre-commit hooks mirror the CI gates so problems are caught before a push.
# Install with: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest (100% coverage)
        entry: python -m pytest
        language: system
        pass_filenames: false
        types: [python]

      - id: rubric-check
        name: tool-definition quality gate
        entry: python scripts/rubric_check.py
        language: system
        pass_filenames: false
        types: [python]

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      # Shared gate in ~/utils owns the namespaces and the exemption list, so
      # one repo's idea of a valid name cannot drift from every other repo's.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$
