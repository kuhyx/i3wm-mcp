name: file-length

# The shared 250-line cap, enforced on push as well as at commit time.
# The local pre-commit hook can be skipped (a fresh clone that never ran
# `pre-commit install` has no hooks at all), so the cap needs a second gate
# that no one can forget to install.
#
# Runs `--all` rather than the changed files: on a push, "the files in the
# commit" is ambiguous, and the whole tree is cheap for a repo this size.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  file-length:
    name: 250-line file-length cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate and its exemption list live in the shared utils repo so every
      # repo enforces the same cap. Checking it out beats vendoring a copy
      # here, which is exactly how a gate and a survey start disagreeing.
      - name: Check out the shared gate
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils

      - name: Enforce the 250-line cap
        run: UTILS_ROOT=.utils bash scripts/check_file_length.sh --all
