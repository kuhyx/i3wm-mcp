name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install
        # The test suite fakes the i3ipc connection, so no window manager is
        # needed in CI. All checks below run headless.
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Test (pytest, 100% coverage gate)
        run: python -m pytest

      - name: Tool-definition quality gate
        run: python scripts/rubric_check.py
